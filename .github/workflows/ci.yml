name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed userscripts are up to date
        run: |
          test -f dist/linuxdo-work-mode.user.js
          test -f dist/v2ex-work-mode.user.js
          test -f dist/chiphell-work-mode.user.js
          test -f dist/hupu-work-mode.user.js
          test -f dist/zhihu-work-mode.user.js
          test -f dist/weibo-work-mode.user.js
          test -z "$(git status --porcelain -- dist)"

      - name: Upload userscripts
        uses: actions/upload-artifact@v4
        with:
          name: work-mode-userscripts
          path: dist/*.user.js
          if-no-files-found: error